name: ecommerce-mvp

networks:
  ecommerce-network:
    driver: bridge

services:
  # ================= HẠ TẦNG (Database-per-Service: mỗi service một DB riêng) =================
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./db/auth/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ecommerce-network]

  customer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer_user
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD:?}
    volumes:
      - customer-db-data:/var/lib/postgresql/data
      - ./db/customer/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_user -d customer_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ecommerce-network]

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?}
    volumes:
      - order-db-data:/var/lib/postgresql/data
      - ./db/order/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ecommerce-network]

  product-db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
    volumes:
      - product-db-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u root -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ecommerce-network]

  shipment-db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
    volumes:
      - shipment-db-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u root -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ecommerce-network]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: 
        - ecommerce-network

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [ecommerce-network]

  # ================= ỨNG DỤNG =================
  auth-service:
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      GRPC_PORT: 50051
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      STAFF_USERNAME: ${STAFF_USERNAME:-}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-}
      STAFF_EMAIL: ${STAFF_EMAIL:-}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      auth-db:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ecommerce-network]

  customer-service:
    build: { context: ., dockerfile: services/customer-service/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3002
      GRPC_PORT: 50052
      DB_HOST: customer-db
      DB_PORT: 5432
      DB_NAME: customer_db
      DB_USER: customer_user
      DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      customer-db:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ecommerce-network]

  order-service:
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3003
      GRPC_PORT: 50054
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USER: order_user
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      CUSTOMER_GRPC_URL: customer-service:50052
      PRODUCT_GRPC_URL: product-service:50053
      KAFKA_BROKERS: kafka:9092
    depends_on:
      order-db:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ecommerce-network]

  product-service:
    build: { context: ., dockerfile: services/product-service/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3004
      GRPC_PORT: 50053
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD:?}@product-db:27017/product_db?authSource=admin
    depends_on:
      product-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ecommerce-network]

  shipment-service:
    build: { context: ., dockerfile: services/shipment-service/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3005
      GRPC_PORT: 50055
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD:?}@shipment-db:27017/shipment_db?authSource=admin
      KAFKA_BROKERS: kafka:9092
    depends_on:
      shipment-db:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ecommerce-network]

  # Điểm vào DUY NHẤT: chỉ api-gateway mở cổng ra máy host.
  api-gateway:
    build: { context: ., dockerfile: services/api-gateway/Dockerfile }
    restart: unless-stopped
    environment:
      PORT: 3000
      AUTH_GRPC_URL: auth-service:50051
      REDIS_URL: redis://redis:6379
      CUSTOMER_GRPC_URL: customer-service:50052
      PRODUCT_GRPC_URL: product-service:50053
      ORDER_GRPC_URL: order-service:50054
      SHIPMENT_GRPC_URL: shipment-service:50055
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-network

volumes:
  auth-db-data:
  customer-db-data:
  order-db-data:
  product-db-data:
  shipment-db-data:
